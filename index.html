<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SecureLink —— 敏感数据安全传输与接口验签演示：RSA+AES 密钥协商、AES-256-GCM 加解密、HMAC 防重放"
    />
    <meta name="keywords" content="SecureLink,security,crypto,AES,HMAC,RSA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>SecureLink · 敏感数据安全传输</title>
  </head>

  <body>
    <div id="app" class="app">
      <!--加载动画-->
      <div class="mesh-loader">
        <div class="set-one">
          <div class="circle"></div>
          <div class="circle"></div>
        </div>
        <div class="set-two">
          <div class="circle"></div>
          <div class="circle"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>

    <style>
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      #app {
        position: relative;
        width: 100%;
        min-height: 100%;
      }

      .mesh-loader {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .mesh-loader .circle {
        position: absolute;
        width: 25px;
        height: 25px;
        margin: -12.5px;
        background: #0d9488;
        border-radius: 50%;
        animation: mesh 3s ease-in-out infinite;
      }

      .mesh-loader > div .circle:last-child {
        animation-delay: 0s;
      }

      .mesh-loader > div {
        position: absolute;
        top: 50%;
        left: 50%;
      }

      .mesh-loader > div:last-child {
        transform: rotate(90deg);
      }

      @keyframes mesh {
        0% {
          transform: rotate(0);
          transform-origin: 50% -100%;
        }

        50% {
          transform: rotate(360deg);
          transform-origin: 50% -100%;
        }

        50.00001% {
          transform: rotate(0deg);
          transform-origin: 50% 200%;
        }

        100% {
          transform: rotate(360deg);
          transform-origin: 50% 200%;
        }
      }
    </style>
  </body>
</html>
